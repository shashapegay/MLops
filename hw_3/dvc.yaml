# DVC pipeline: collect -> clean -> diversity -> split -> contamination.
stages:
  collect:
    cmd: python -m src.collect
    deps:
      - src/collect.py
      - src/config.py
    params:
      - collect
      - paths.raw
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: false

  clean:
    cmd: python -m src.clean
    deps:
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/textnorm.py
      - src/stats.py
      - src/config.py
    params:
      - clean
      - paths.clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: false

  diversity:
    cmd: python -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - split.group_key
      - paths.clean
    metrics:
      - metrics/diversity.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - data/clean.jsonl
      - src/split.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - paths.train
      - paths.val
      - paths.test
    outs:
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: false

  contamination:
    cmd: python scripts/check_contamination.py
    deps:
      - data/train.jsonl
      - data/test.jsonl
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - scripts/check_contamination.py
    params:
      - clean.near_dup
      - contamination
      - paths.train
      - paths.test
      - paths.metrics_contamination
    metrics:
      - metrics/contamination.json:
          cache: false
